[project]
name = "parcelpilot-support"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "pypdf>=5.0",
  "openai>=1.50",
  "python-dotenv>=1.0",
  "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
